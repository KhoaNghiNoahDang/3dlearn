worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/xml
    image/svg+xml
    text/css
    text/plain;

  server {
    # The container drops all Linux capabilities, including
    # NET_BIND_SERVICE. Use an unprivileged port internally and let the
    # host/proxy publish it as needed.
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;

    # The app shell may be embedded only by the same origin. Legacy lessons
    # are separate static files and are not rewritten into the app shell.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=()" always;

    # Enable HSTS only when this container is behind HTTPS in production.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /healthz {
      access_log off;
      default_type text/plain;
      add_header Cache-Control "no-store" always;
      try_files /healthz.html =404;
    }

    location = /version {
      access_log off;
      default_type application/json;
      add_header Cache-Control "no-store" always;
      try_files /version.json =404;
    }

    # Only /app routes use SPA fallback. Existing files win, so assets under
    # /app/assets remain addressable without being rewritten unexpectedly.
    location = /app {
      return 301 /app/;
    }

    location ^~ /app/ {
      try_files $uri $uri/ /app/index.html;
    }

    # Never send legacy HTML, covers, catalog or content requests to the SPA.
    # A missing asset is a real 404, which makes deployment problems visible.
    location ^~ /courses/ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }

    location ^~ /covers/ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location ^~ /content/ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }

    location ^~ /bridge/ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }

    location = /catalog.json {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }

    # Do not expose repository or build internals if they are mounted by
    # mistake. Textbook PDFs belong in private/object storage, not this image.
    location ~ /\.(?!well-known) {
      deny all;
    }

    location ~* ^/(SGK|_viethoa|node_modules|dist|\.git)(/|$) {
      return 404;
    }

    location / {
      try_files $uri $uri/ =404;
    }
  }
}
