<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mô phỏng 3D Cấu trúc Tế bào · 3D Lab</title>
<style>
  :root {
    --bg: #070d18;
    --glass: rgba(11, 19, 35, 0.78);
    --glass-border: rgba(255, 255, 255, 0.1);
    --accent: #41c98a;
    --accent-soft: rgba(65, 201, 138, 0.15);
    --text: #f0f4fa;
    --text-muted: #8c9cb8;
    --font: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); font-family: var(--font); color: var(--text); user-select: none; }
  
  #canvas-container { position: absolute; inset: 0; z-index: 1; }
  canvas { display: block; width: 100%; height: 100%; outline: none; }

  /* Top Bar */
  .cell-top {
    position: absolute; top: 16px; left: 16px; z-index: 10;
    display: flex; align-items: center; gap: 12px;
    padding: 10px 18px; border-radius: 14px;
    background: var(--glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  }
  .cell-badge {
    padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 800;
    text-transform: uppercase; letter-spacing: 0.05em;
    background: var(--accent-soft); color: var(--accent);
  }
  .cell-title h2 { font-size: 16px; font-weight: 700; color: #fff; line-height: 1.2; }
  .cell-title p { font-size: 12px; color: var(--text-muted); }

  /* Left Panel: Organelles */
  .cell-left {
    position: absolute; top: 86px; left: 16px; bottom: 84px; width: min(340px, calc(100vw - 32px));
    z-index: 10; display: flex; flex-direction: column; gap: 12px;
    pointer-events: none;
  }
  .organelle-card {
    pointer-events: auto;
    padding: 18px; border-radius: 16px;
    background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    box-shadow: 0 14px 40px rgba(0,0,0,0.4);
    display: flex; flex-direction: column; gap: 10px;
    animation: fadeSlide 0.3s cubic-bezier(0.2,0.8,0.2,1);
  }
  @keyframes fadeSlide { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .organelle-header { display: flex; justify-content: space-between; align-items: flex-start; }
  .organelle-header h3 { font-size: 15px; font-weight: 700; color: #fff; }
  .organelle-header span { font-size: 11px; color: var(--accent); font-weight: 600; }
  .organelle-desc { font-size: 13px; line-height: 1.6; color: #cbd5e1; }
  .organelle-attrs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
  .attr-box { padding: 6px 10px; border-radius: 8px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.05); }
  .attr-box small { display: block; font-size: 10px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
  .attr-box strong { font-size: 12px; color: #f1f5f9; }
  .organelle-fact {
    padding: 8px 12px; border-radius: 10px; font-size: 11px; line-height: 1.5;
    background: rgba(255,255,255,0.03); border-left: 3px solid var(--accent); color: #94a3b8;
  }

  /* Organelle chips rail */
  .organelle-chips {
    pointer-events: auto;
    display: flex; flex-wrap: wrap; gap: 6px;
    max-height: 140px; overflow-y: auto;
    padding: 4px;
    scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.15) transparent;
  }
  .chip-btn {
    padding: 6px 12px; border-radius: 99px; border: 1px solid rgba(255,255,255,0.08);
    background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(10px);
    color: var(--text-muted); font-size: 12px; font-weight: 600; cursor: pointer;
    transition: all 0.18s;
  }
  .chip-btn:hover { background: rgba(255,255,255,0.12); color: #fff; transform: translateY(-1px); }
  .chip-btn.active {
    background: var(--accent); color: #04100c; font-weight: 700; border-color: var(--accent);
    box-shadow: 0 4px 14px var(--accent-soft);
  }

  /* Right Tools Toolbar */
  .cell-tools {
    position: absolute; top: 16px; right: 16px; z-index: 10;
    display: flex; flex-direction: column; gap: 8px;
  }
  .tool-btn {
    display: flex; align-items: center; justify-content: center;
    width: 40px; height: 40px; border-radius: 12px;
    background: var(--glass); backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border); color: var(--text-muted);
    cursor: pointer; transition: all 0.18s;
  }
  .tool-btn:hover { background: rgba(255,255,255,0.14); color: #fff; transform: scale(1.05); }
  .tool-btn.active { background: var(--accent); color: #04100c; border-color: var(--accent); }
  .tool-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* Bottom Steps Bar */
  .cell-bottom {
    position: absolute; bottom: 16px; left: 16px; right: 16px; z-index: 10;
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    padding: 10px 18px; border-radius: 16px;
    background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  .steps-track { display: flex; align-items: center; gap: 8px; overflow-x: auto; scrollbar-width: none; }
  .steps-track::-webkit-scrollbar { display: none; }
  .step-node {
    display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 10px;
    font-size: 12px; font-weight: 600; color: var(--text-muted); cursor: pointer;
    background: transparent; border: 1px solid transparent; transition: all 0.2s; white-space: nowrap;
  }
  .step-node i { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: rgba(255,255,255,0.08); font-style: normal; font-size: 11px; }
  .step-node:hover { background: rgba(255,255,255,0.06); color: #fff; }
  .step-node.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .step-node.active i { background: var(--accent); color: #04100c; font-weight: 800; }
  .nav-btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 10px;
    border: 1px solid var(--glass-border); background: rgba(255,255,255,0.06);
    color: #fff; font-size: 12px; font-weight: 700; cursor: pointer; transition: all 0.18s;
  }
  .nav-btn:hover:not(:disabled) { background: rgba(255,255,255,0.14); }
  .nav-btn:disabled { opacity: 0.35; cursor: default; }

  /* Loading State */
  .cell-loading {
    position: absolute; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: radial-gradient(circle at center, rgba(16,28,48,0.92), rgba(6,11,20,0.98));
    transition: opacity 0.5s;
  }
  .spinner {
    width: 44px; height: 44px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.12); border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .cell-loading strong { font-size: 15px; color: #fff; }
  .cell-loading small { font-size: 12px; color: var(--text-muted); }

  @media (max-width: 768px) {
    .cell-left { width: calc(100vw - 32px); bottom: 130px; }
    .organelle-card { padding: 14px; }
    .cell-bottom { flex-direction: column; align-items: stretch; gap: 10px; }
    .steps-track { justify-content: flex-start; }
    .nav-buttons { display: flex; justify-content: space-between; }
  }
</style>

{
  "imports": {

  </button>

    <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
  </button>
</aside>

<!-- Bottom Steps Bar -->
<footer class="cell-bottom">
  <nav class="steps-track" id="steps-track"></nav>
  <div class="nav-buttons" style="display:flex;gap:8px;">
    <button class="nav-btn" id="btn-prev" disabled>← Bước trước</button>
    <button class="nav-btn" id="btn-next">Bước tiếp theo →</button>
  </div>
</footer>

<!-- Loading Screen -->
<div class="cell-loading" id="loading-overlay">
  <div class="spinner"></div>
  <strong id="loading-title">Đang dựng mô hình 3D…</strong>
  <small id="loading-detail">Tải cấu trúc tế bào từ thư viện</small>
</div>

// ── Bridge Communication with LessonShell ──────────────────────────────────
const BRIDGE_MSG = '3dlearn:legacy-bridge';
const BRIDGE_VERSION = 1;
const bridgeParentOrigin = (() => {
  try { return document.referrer ? new URL(document.referrer).origin : null; } catch { return null; }
})();
let bridgeMode = 'rotate';
let bridgeCanvas = null;
let bridgeZoomGesture = null;
let bridgeReady = false;

function notifyBridge(type, payload = {}) {
  if (!window.parent || window.parent === window) return;
  try {
    window.parent.postMessage(
      { protocol: BRIDGE_MSG, version: BRIDGE_VERSION, type, payload },
      bridgeParentOrigin || '*',
    );
  } catch {}
}

function isTrustedBridgeMessage(event) {
  if (event.source !== window.parent) return false;
  if (event.origin === 'null') return true;
  return !bridgeParentOrigin || event.origin === bridgeParentOrigin;
}

function makeBridgePointerEvent(type, source, button) {
  try {
    return new PointerEvent(type, {
      bubbles: true,
      cancelable: true,
      composed: true,
      pointerId: source.pointerId,
      pointerType: source.pointerType,
      isPrimary: source.isPrimary,
      clientX: source.clientX,
      clientY: source.clientY,
      screenX: source.screenX,
      screenY: source.screenY,
      buttons: button === 2 ? 2 : 1,
      button,
    });
  } catch {
    return null;
  }
}

// Keep OrbitControls intact and only remap the shell's selected left-drag
// gesture. Native right-drag, wheel zoom and touch gestures remain available.
function onBridgePointerDown(event) {
  if (!bridgeCanvas || event.pointerType !== 'mouse' || event.button !== 0) return;
  if (bridgeMode === 'pan') {
    event.preventDefault();
    event.stopImmediatePropagation();
    const synthetic = makeBridgePointerEvent('pointerdown', event, 2);
    if (synthetic) bridgeCanvas.dispatchEvent(synthetic);
  } else if (bridgeMode === 'zoom') {
    event.preventDefault();
    event.stopImmediatePropagation();
    bridgeZoomGesture = { x: event.clientX, y: event.clientY };
  }
}

function onBridgePointerMove(event) {
  if (!bridgeZoomGesture || event.pointerType !== 'mouse') return;
  event.preventDefault();
  event.stopImmediatePropagation();
  const deltaY = event.clientY - bridgeZoomGesture.y;
  if (Math.abs(deltaY) < 2) return;
  bridgeZoomGesture.y = event.clientY;
  bridgeCanvas.dispatchEvent(new WheelEvent('wheel', {
    bubbles: true,
    cancelable: true,
    clientX: event.clientX,
    clientY: event.clientY,
    deltaY: deltaY * 3,
    deltaMode: 0,
  }));
}

function onBridgePointerEnd(event) {
  if (!bridgeZoomGesture || event.pointerType !== 'mouse') return;
  event.preventDefault();
  event.stopImmediatePropagation();
  bridgeZoomGesture = null;
}

function setBridgeMode(nextMode) {
  if (!['rotate', 'pan', 'zoom'].includes(nextMode)) return false;
  bridgeMode = nextMode;
  if (bridgeCanvas) bridgeCanvas.dataset.threeDLearnMode = bridgeMode;
  notifyBridge('modeChanged', { mode: bridgeMode, applied: true });
  return true;
}

function bridgeState() {
  return {
    mode: bridgeMode,
    step: currentStepIdx,
    count: currentCell.steps.length,
    canvas: Boolean(bridgeCanvas),
    webgl: Boolean(bridgeCanvas?.getContext('webgl2') || bridgeCanvas?.getContext('webgl') || bridgeCanvas?.getContext('experimental-webgl')),
    ready: bridgeReady,
  };
}

function acknowledgeBridge(message, ok) {
  notifyBridge('ack', {
    requestId: message.requestId || null,
    command: message.type,
    ok,
  });
}

window.addEventListener('message', (event) => {
  if (!isTrustedBridgeMessage(event)) return;
  const message = event.data;
  if (!message || message.protocol !== BRIDGE_MSG || message.version !== BRIDGE_VERSION) return;

  const payload = message.payload || {};
  if (message.type === 'setMode') {
    acknowledgeBridge(message, typeof payload.mode === 'string' && setBridgeMode(payload.mode));
  } else if (message.type === 'reset') {
    resetView();
    acknowledgeBridge(message, true);
  } else if (message.type === 'setStep') {
    const ok = Number.isInteger(payload.index) && payload.index >= 0 && payload.index < currentCell.steps.length;
    if (ok) goToStep(payload.index);
    acknowledgeBridge(message, ok);
  } else if (message.type === 'requestState') {
    notifyBridge('state', bridgeState());
  }
});

// ── Three.js Scene Setup ────────────────────────────────────────────────────
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070d18);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0, 7.5);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);
bridgeCanvas = renderer.domElement;
bridgeCanvas.dataset.threeDLearnMode = bridgeMode;
bridgeCanvas.addEventListener('pointerdown', onBridgePointerDown, true);
bridgeCanvas.addEventListener('pointermove', onBridgePointerMove, true);
bridgeCanvas.addEventListener('pointerup', onBridgePointerEnd, true);
bridgeCanvas.addEventListener('pointercancel', onBridgePointerEnd, true);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2.5;
controls.maxDistance = 18;

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
scene.add(ambientLight);

const dirLight1 = new THREE.DirectionalLight(0xfff5ea, 1.8);
dirLight1.position.set(5, 8, 6);
dirLight1.castShadow = true;
scene.add(dirLight1);

const dirLight2 = new THREE.DirectionalLight(0x90c5ff, 0.8);
dirLight2.position.set(-6, -4, -4);
scene.add(dirLight2);

// Model Root Group
const modelGroup = new THREE.Group();
scene.add(modelGroup);

// Phase 2 overlays: these are deliberately procedural and local. They make
// the two P0 lessons change state in the 3D scene instead of only changing the
// explanatory text/selected organelle.
const phaseVisualGroup = new THREE.Group();
modelGroup.add(phaseVisualGroup);
let mitosisVisual = null;
let osmosisVisual = null;

function createPhaseVisuals() {
  if (!phaseKey) return;
  phaseVisualGroup.scale.setScalar(currentCell.scale || 1);
  if (currentCell.rotation) phaseVisualGroup.rotation.set(...currentCell.rotation);
  if (currentCell.position) phaseVisualGroup.position.set(...currentCell.position);

  if (phaseKey === 'mitosis') {
    const group = new THREE.Group();
    const chromosomeMaterial = new THREE.MeshStandardMaterial({ color: 0xffc857, emissive: 0x5a3500, emissiveIntensity: 0.4, roughness: 0.35 });
    const chromosomeGeometry = new THREE.BoxGeometry(0.08, 0.48, 0.08);
    const chromosomes = Array.from({ length: 6 }, () => {
      const mesh = new THREE.Mesh(chromosomeGeometry, chromosomeMaterial);
      mesh.castShadow = true;
      group.add(mesh);
      return mesh;
    });
    const poleMaterial = new THREE.MeshStandardMaterial({ color: 0x74d7ff, emissive: 0x123f5a, emissiveIntensity: 0.5 });
    const poles = [-1, 1].map((side) => {
      const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.11, 18, 18), poleMaterial);
      mesh.position.set(side * 0.72, 0, 0);
      group.add(mesh);
      return mesh;
    });
    const spindleMaterial = new THREE.LineBasicMaterial({ color: 0x74d7ff, transparent: true, opacity: 0.68 });
    const spindleGeometry = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(-0.72, 0, 0), new THREE.Vector3(0, 0, 0),
      new THREE.Vector3(0.72, 0, 0), new THREE.Vector3(0, 0, 0),
    ]);
    const spindle = new THREE.LineSegments(spindleGeometry, spindleMaterial);
    group.add(spindle);
    phaseVisualGroup.add(group);
    mitosisVisual = { group, chromosomes, poles, spindle };
  }

  if (phaseKey === 'osmosis') {
    const vacuole = new THREE.Mesh(
      new THREE.SphereGeometry(0.82, 32, 24),
      new THREE.MeshPhysicalMaterial({ color: 0x69c7ee, transparent: true, opacity: 0.28, roughness: 0.12, transmission: 0.12 }),
    );
    const membrane = new THREE.Mesh(
      new THREE.SphereGeometry(1.08, 32, 24),
      new THREE.MeshBasicMaterial({ color: 0x9ee8ff, transparent: true, opacity: 0.2, wireframe: true }),
    );
    phaseVisualGroup.add(vacuole, membrane);
    osmosisVisual = { vacuole, membrane };
  }
  updatePhaseVisual(0);
}

function updatePhaseVisual(index) {
  if (mitosisVisual) {
    const { chromosomes, poles, spindle } = mitosisVisual;
    const phase = Math.max(0, Math.min(5, index));
    const layouts = [
      [[0, 0, 0], [0.16, 0.08, 0], [-0.16, -0.08, 0], [0.08, -0.16, 0], [-0.08, 0.16, 0], [0, 0.18, 0]],
      [[-0.28, 0.16, 0], [-0.1, -0.12, 0], [0.1, 0.12, 0], [0.28, -0.16, 0], [0, 0, 0.16], [0, 0, -0.16]],
      [[-0.18, 0, 0], [-0.06, 0, 0], [0.06, 0, 0], [0.18, 0, 0], [0, 0, 0.12], [0, 0, -0.12]],
      [[-0.54, 0.14, 0], [-0.54, -0.14, 0], [0.54, 0.14, 0], [0.54, -0.14, 0], [-0.42, 0, 0.12], [0.42, 0, -0.12]],
      [[-0.64, 0.14, 0], [-0.64, -0.14, 0], [0.64, 0.14, 0], [0.64, -0.14, 0], [-0.52, 0, 0.12], [0.52, 0, -0.12]],
      [[-0.64, 0.16, 0], [-0.64, -0.16, 0], [0.64, 0.16, 0], [0.64, -0.16, 0], [-0.52, 0, 0.12], [0.52, 0, -0.12]],
    ][phase];
    chromosomes.forEach((mesh, i) => {
      mesh.visible = phase > 0;
      if (layouts[i]) mesh.position.set(...layouts[i]);
      mesh.scale.set(phase === 5 ? 0.82 : 1, 1, 1);
    });
    poles.forEach((pole) => { pole.visible = phase >= 1; });
    spindle.visible = phase >= 1 && phase <= 3;
  }
  if (osmosisVisual) {
    const { vacuole, membrane } = osmosisVisual;
    const phase = Math.max(0, Math.min(5, index));
    const vacuoleScale = [0.72, 0.92, 1.08, 0.86, 0.62, 0.88][phase];
    const membraneScale = [1.02, 1.05, 1.08, 1.13, 1.2, 1.08][phase];
    vacuole.scale.set(vacuoleScale, vacuoleScale * 0.92, vacuoleScale);
    membrane.scale.set(membraneScale, membraneScale * 0.92, membraneScale);
    vacuole.material.opacity = phase === 4 ? 0.2 : 0.28;
    membrane.material.opacity = phase === 4 ? 0.45 : 0.2;
  }
}

createPhaseVisuals();

// Fallback procedural geometry if GLB is loading or unavailable
function createProceduralFallback(cell) {
  const group = new THREE.Group();
  const sphereGeo = new THREE.SphereGeometry(1.4, 48, 48);
  const sphereMat = new THREE.MeshStandardMaterial({
    color: cell.color,
    roughness: 0.45,
    metalness: 0.05,
    transparent: true,
    opacity: 0.85
  });
  const body = new THREE.Mesh(sphereGeo, sphereMat);
  body.castShadow = true;
  group.add(body);

  // Nucleus inside
  const nucGeo = new THREE.SphereGeometry(0.5, 32, 32);
  const nucMat = new THREE.MeshStandardMaterial({ color: 0x9333ea, roughness: 0.3 });
  const nuc = new THREE.Mesh(nucGeo, nucMat);
  nuc.position.set(0.1, 0.1, 0.1);
  group.add(nuc);
  return group;
}

// Procedural Muscle Model (Striated Muscle Fiber)
function createMuscleModel() {
  const group = new THREE.Group();
  const fiberLength = 4.4;
  const sarcomereCount = 12;
  const myofibrilLayout = [
    { y: 0.36, z: 0.0 },
    { y: 0.18, z: 0.34 },
    { y: 0.18, z: -0.34 },
    { y: -0.18, z: 0.34 },
    { y: -0.18, z: -0.34 },
    { y: -0.36, z: 0.0 },
    { y: 0.0, z: 0.0 }
  ];

  // Sarcolemma (outer membrane sheath)
  const sarcoMat = new THREE.MeshStandardMaterial({
    color: 0xd7b284,
    transparent: true,
    opacity: 0.38,
    roughness: 0.45
  });
  const sarcoGeo = new THREE.CylinderGeometry(0.58, 0.58, fiberLength, 32);
  const sarco = new THREE.Mesh(sarcoGeo, sarcoMat);
  sarco.rotation.z = Math.PI / 2;
  sarco.castShadow = true;
  group.add(sarco);

  // Myofibrils
  const myoMat = new THREE.MeshStandardMaterial({
    color: 0xbd3d51,
    roughness: 0.5
  });
  myofibrilLayout.forEach(pos => {
    const geo = new THREE.CylinderGeometry(0.1, 0.1, fiberLength, 16);
    const mesh = new THREE.Mesh(geo, myoMat);
    mesh.rotation.z = Math.PI / 2;
    mesh.position.set(0, pos.y, pos.z);
    mesh.castShadow = true;
    group.add(mesh);
  });

  // Sarcomere Z-disc stripes
  const bandMat = new THREE.MeshStandardMaterial({ color: 0x6e1b29, roughness: 0.3 });
  for (let i = 0; i <= sarcomereCount; i++) {
    const x = -fiberLength / 2 + (i * fiberLength / sarcomereCount);
    const ringGeo = new THREE.TorusGeometry(0.58, 0.015, 8, 32);
    const ring = new THREE.Mesh(ringGeo, bandMat);
    ring.rotation.y = Math.PI / 2;
    ring.position.x = x;
    group.add(ring);
  }

  // Mitochondria between fibers
  const mitoMat = new THREE.MeshStandardMaterial({ color: 0xcf7042, roughness: 0.4 });
  const mitoPositions = [
    [-1.2, 0.42, 0.2], [-0.4, -0.42, -0.2], [0.6, 0.42, -0.2], [1.3, -0.42, 0.2]
  ];
  mitoPositions.forEach(p => {
    const mitoGeo = new THREE.CapsuleGeometry(0.08, 0.22, 6, 12);
    const mito = new THREE.Mesh(mitoGeo, mitoMat);
    mito.rotation.z = Math.PI / 2;
    mito.position.set(p[0], p[1], p[2]);
    group.add(mito);
  });

  return group;
}

// Procedural Epithelial Model (Polarized Columnar Epithelium)
function createEpithelialModel() {
  const group = new THREE.Group();
  // Columnar body
  const bodyMat = new THREE.MeshStandardMaterial({
    color: 0xd79baa,
    transparent: true,
    opacity: 0.68,
    roughness: 0.5
  });
  const bodyGeo = new THREE.CylinderGeometry(0.85, 0.95, 2.8, 32);
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.castShadow = true;
  group.add(body);

  // Neighbor cells on sides (semi-transparent)
  const neighMat = new THREE.MeshStandardMaterial({ color: 0xc98ba0, transparent: true, opacity: 0.32 });
  [-1.75, 1.75].forEach(x => {
    const n = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.9, 2.5, 24), neighMat);
    n.position.set(x, -0.15, 0);
    group.add(n);
  });

  // Dense microvilli on top brush border
  const villiMat = new THREE.MeshStandardMaterial({ color: 0xc86f80, roughness: 0.4 });
  const rows = 6, cols = 6;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const x = -0.6 + c * 0.24 + (r % 2 === 0 ? 0 : 0.12);
      const z = -0.6 + r * 0.24;
      if (Math.hypot(x, z) > 0.75) continue;
      const h = 0.4 + Math.sin(r * 1.5 + c) * 0.08;
      const villus = new THREE.Mesh(new THREE.CapsuleGeometry(0.038, h, 6, 12), villiMat);
      villus.position.set(x, 1.4 + h / 2, z);
      villus.castShadow = true;
      group.add(villus);
    }
  }

  // Nucleus in lower basal section
  const nucMat = new THREE.MeshStandardMaterial({ color: 0x7a4aa2, roughness: 0.35 });
  const nuc = new THREE.Mesh(new THREE.SphereGeometry(0.5, 32, 32), nucMat);
  nuc.scale.set(1.0, 0.75, 1.0);
  nuc.position.set(0, -0.55, 0);
  group.add(nuc);

  // Tight junctions ring
  const juncMat = new THREE.MeshStandardMaterial({ color: 0x9f6cbd, roughness: 0.3 });
  const junc = new THREE.Mesh(new THREE.TorusGeometry(0.86, 0.045, 10, 36), juncMat);
  junc.rotation.x = Math.PI / 2;
  junc.position.set(0, 1.05, 0);
  group.add(junc);

  return group;
}

// Load 3D Asset or Build Procedural Model
if (currentCell.modelUrl) {
  const loader = new GLTFLoader();
  loadingDetail.textContent = `Đang tải mô hình ${currentCell.name}…`;

  loader.load(
    currentCell.modelUrl,
    (gltf) => {
      const root = gltf.scene;
      root.scale.setScalar(currentCell.scale || 1);
      if (currentCell.rotation) root.rotation.set(...currentCell.rotation);
      if (currentCell.position) root.position.set(...currentCell.position);

      root.traverse((node) => {
        if (node.isMesh) {
          node.castShadow = true;
          node.receiveShadow = true;
          if (node.material) {
            node.material.side = THREE.DoubleSide;
          }
        }
      });

      modelGroup.add(root);
      hideLoading();
      announceBridgeReady();
    },
    (xhr) => {
      if (xhr.total > 0) {
        const pct = Math.round((xhr.loaded / xhr.total) * 100);
        loadingDetail.textContent = `${pct}% đã tải`;
      }
    },
    (err) => {
      console.warn('GLB load error, using fallback:', err);
      modelGroup.add(createProceduralFallback(currentCell));
      hideLoading();
      announceBridgeReady();
    }
  );
} else if (currentCell.id === 'muscle') {
  loadingDetail.textContent = 'Đang dựng mô hình sợi cơ vân 3D…';
  modelGroup.add(createMuscleModel());
  modelGroup.scale.setScalar(currentCell.scale || 1);
  if (currentCell.rotation) modelGroup.rotation.set(...currentCell.rotation);
  hideLoading();
  announceBridgeReady();
} else if (currentCell.id === 'epithelial') {
  loadingDetail.textContent = 'Đang dựng mô hình tế bào biểu mô 3D…';
  modelGroup.add(createEpithelialModel());
  modelGroup.scale.setScalar(currentCell.scale || 1);
  if (currentCell.rotation) modelGroup.rotation.set(...currentCell.rotation);
  hideLoading();
  announceBridgeReady();
} else {
  modelGroup.add(createProceduralFallback(currentCell));
  hideLoading();
  announceBridgeReady();
}

function hideLoading() {
  loadingOverlay.style.opacity = '0';
  setTimeout(() => loadingOverlay.style.display = 'none', 500);
}

function announceBridgeReady() {
  if (bridgeReady) return;
  bridgeReady = true;
  notifyBridge('ready', {
    ...bridgeState(),
    capabilities: { reset: true, mode: true, step: true, state: true },
  });
  notifyBridge('stepChanged', { index: currentStepIdx, count: currentCell.steps.length });
}

// ── UI Interactivity ────────────────────────────────────────────────────────
function renderOrganelleCard(orgId) {
  const org = currentCell.organelles.find(o => o.id === orgId) || currentCell.organelles[0];
  activeOrganelleId = org.id;

  orgName.textContent = org.name;
  orgSubtitle.textContent = org.subtitle;
  orgDesc.textContent = org.desc;
  orgFact.textContent = `💡 ${org.fact}`;

  orgAttrs.innerHTML = org.attrs.map(a => `
    <div class="attr-box">
      <small>${a.label}</small>
      <strong>${a.value}</strong>
    </div>
  `).join('');

  // Update chip active status
  document.querySelectorAll('.chip-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.org === org.id);
  });
}

function renderChips() {
  chipsContainer.innerHTML = currentCell.organelles.map(org => `
    <button class="chip-btn ${org.id === activeOrganelleId ? 'active' : ''}" data-org="${org.id}">
      ${org.name}
    </button>
  `).join('');

  chipsContainer.querySelectorAll('.chip-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      renderOrganelleCard(btn.dataset.org);
    });
  });
}

function renderSteps() {
  stepsTrack.innerHTML = currentCell.steps.map((step, idx) => `
    <button class="step-node ${idx === currentStepIdx ? 'active' : ''}" data-idx="${idx}">
      <i>${idx + 1}</i>
      <span>${step.title}</span>
    </button>
  `).join('');

  stepsTrack.querySelectorAll('.step-node').forEach(btn => {
    btn.addEventListener('click', () => {
      goToStep(parseInt(btn.dataset.idx, 10));
    });
  });

  updateNavButtons();
}

function goToStep(idx) {
  if (idx < 0 || idx >= currentCell.steps.length) return;
  currentStepIdx = idx;
  const step = currentCell.steps[idx];
  updatePhaseVisual(idx);

  // Update steps UI
  document.querySelectorAll('.step-node').forEach((node, i) => {
    node.classList.toggle('active', i === idx);
  });

  // Switch to the step's organelle
  if (step.organelle) {
    renderOrganelleCard(step.organelle);
  }
  if (step.text) {
    orgDesc.textContent = step.text;
  }

  updateNavButtons();
  notifyBridge('stepChanged', { index: idx, count: currentCell.steps.length });
}

function updateNavButtons() {
  btnPrev.disabled = currentStepIdx === 0;
  btnNext.disabled = currentStepIdx === currentCell.steps.length - 1;
}

btnPrev.addEventListener('click', () => goToStep(currentStepIdx - 1));
btnNext.addEventListener('click', () => goToStep(currentStepIdx + 1));

// Tools Buttons
btnRotate.addEventListener('click', () => {
  autoRotate = !autoRotate;
  btnRotate.classList.toggle('active', autoRotate);
});
btnRotate.classList.toggle('active', autoRotate);

btnCutaway.addEventListener('click', () => {
  setCutaway(!isCutaway);
});

function setCutaway(nextValue) {
  isCutaway = Boolean(nextValue);
  btnCutaway.classList.toggle('active', isCutaway);
  modelGroup.traverse(node => {
    if (!node.isMesh || !node.material) return;
    const materials = Array.isArray(node.material) ? node.material : [node.material];
    materials.forEach(material => {
      if (material.userData.cellBaseOpacity == null) {
        material.userData.cellBaseOpacity = material.opacity;
        material.userData.cellBaseTransparent = material.transparent;
      }
      material.transparent = isCutaway || material.userData.cellBaseTransparent;
      material.opacity = isCutaway
        ? Math.min(material.userData.cellBaseOpacity, 0.38)
        : material.userData.cellBaseOpacity;
      material.needsUpdate = true;
    });
  });
}

function resetView() {
  controls.reset();
  camera.position.set(0, 0, 7.5);
  modelGroup.rotation.set(0, 0, 0);
  bridgeZoomGesture = null;
  setBridgeMode('rotate');
  setCutaway(false);
  autoRotate = true;
  btnRotate.classList.add('active');
  goToStep(0);
}
btnReset.addEventListener('click', resetView);

// Keyboard shortcuts
window.addEventListener('keydown', (e) => {
  if (e.target.matches('input, textarea')) return;
  if (e.key === ' ' || e.code === 'Space') {
    e.preventDefault();
    btnRotate.click();
  } else if (e.key === 'c' || e.key === 'C') {
    e.preventDefault();
    btnCutaway.click();
  } else if (e.key === 'r' || e.key === 'R') {
    e.preventDefault();
    btnReset.click();
  } else if (e.key === 'ArrowRight') {
    goToStep(currentStepIdx + 1);
  } else if (e.key === 'ArrowLeft') {
    goToStep(currentStepIdx - 1);
  }
});

// Window Resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Initialize UI
renderChips();
renderSteps();
goToStep(0);

// Animation Loop
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  if (autoRotate && modelGroup) {
    modelGroup.rotation.y += delta * 0.12;
  }
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
